<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="description" content="Gestor financeiro pessoal que roda inteiro no seu aparelho.">
  <title>Zero</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zero">

  <link rel="stylesheet" href="./app.css">

  <!--
    As fontes carregam SEM bloquear a renderização.

    Um `<link rel="stylesheet">` comum trava a pintura da página até responder.
    Medido: quando o Google está lento ou bloqueado, isso são 14 segundos de
    tela branca — num app cujos próprios arquivos somam 25 ms. Um app que roda
    inteiro no seu aparelho não pode depender do Google para abrir.

    O truque do `media="print"` faz o navegador baixar sem bloquear; o `onload`
    promove para `all` quando chega. Até lá vale a pilha de fallback do CSS.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
  </noscript>
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot-mark">Zero<i></i></div>
      <p class="boot-msg" id="bootMsg">abrindo…</p>
    </div>
  </div>

  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
